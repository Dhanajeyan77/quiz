
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Session</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root {
      --bg: #000000;
      --panel: rgba(20, 20, 25, 0.65);
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --muted: #a1a1aa;
      --accent: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; overflow: hidden; }
    
    /* Ambient Background Glow */
    body::before { content: ''; position: absolute; top: -20%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 70%); z-index: -1; }
    
    .card { background: var(--panel); padding: 40px 30px; border-radius: 24px; border: 1px solid var(--border); width: 100%; max-width: 480px; text-align: center; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); transition: opacity 0.3s ease; }
    
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
    p.subtitle { color: var(--muted); font-size: 15px; margin-bottom: 24px; }
    
    input { width: 100%; padding: 16px 20px; margin-bottom: 16px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,0,0,0.5); color: white; font-size: 16px; outline: none; transition: border 0.2s; }
    input:focus { border-color: var(--accent); }
    
    button.primary { width: 100%; padding: 18px; border-radius: 12px; border: none; background: #ffffff; color: #000000; font-size: 16px; font-weight: 700; cursor: pointer; transition: transform 0.1s, background 0.2s; }
    button.primary:active { transform: scale(0.97); }
    button.primary:hover { background: #e4e4e7; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 30px; }
    .opt-btn { background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 24px 16px; border-radius: 16px; color: white; cursor: pointer; font-size: 16px; font-weight: 500; transition: all 0.2s; display: flex; align-items: center; justify-content: center; min-height: 80px; }
    .opt-btn:active { transform: scale(0.95); }
    .opt-btn:hover { background: rgba(255,255,255,0.08); }
    
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .timer { font-size: 24px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
    .timer.urgent { color: var(--danger); animation: pulse 1s infinite; }
    
    .score-badge { display: inline-block; padding: 8px 16px; background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.2); color: var(--success); border-radius: 20px; font-weight: 700; font-size: 18px; margin-top: 16px; }
    
    .hidden { display: none !important; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    .pulse-text { animation: pulse 2s infinite; }
  </style>
</head>
<body>
  <div id="lobby" class="card">
    <h1>Enter Session</h1>
    <p class="subtitle">Join the live environment</p>
    <input type="text" id="rno" placeholder="Roll Number (e.g. 22CSEC01)">
    <input type="text" id="fname" placeholder="Full Name">
    <button class="primary" onclick="join()">Initialize</button>
    <p id="err" style="color: var(--danger); margin-top: 16px; font-size: 14px;"></p>
  </div>
  
  <div id="wait" class="card hidden">
    <h1 id="waitMsg" class="pulse-text" style="font-size: 22px;">Awaiting Admin Signal...</h1>
    <p class="subtitle" style="margin-top: 8px;">Stand by for the next module</p>
    <div class="score-badge">Points: <span id="score">0</span></div>
  </div>

  <div id="quiz" class="card hidden" style="max-width: 600px;">
    <div class="header-bar">
      <span id="qnum" style="color: var(--muted); font-weight: 600;">Q 1</span>
      <span id="timer" class="timer">20s</span>
    </div>
    <h2 id="qtext" style="font-size: 20px; line-height: 1.4; font-weight: 600;">Loading data...</h2>
    <div id="opts" class="grid"></div>
    <p id="feedback" style="margin-top:24px; color:var(--muted); font-weight: 500;"></p>
  </div>

  <script>
    const socket = io({ transports: ['websocket'], upgrade: false });
    let state = { roll: '', answered: false, tid: null };
    const $ = id => document.getElementById(id);
    const show = id => { ['lobby','wait','quiz'].forEach(x => $(x).classList.add('hidden')); $(id).classList.remove('hidden'); };

    function join() {
      state.roll = $('rno').value.toUpperCase().trim();
      let n = $('fname').value.trim();
      if(!state.roll || !n) return $('err').innerText = 'Access denied: Fill all fields';
      socket.emit('join_game', { roll_no: state.roll, name: n });
      $('err').innerText = '';
      show('wait');
    }

    socket.on('receive_question', (data) => {
      state.answered = false;
      $('qnum').innerText = `Question ${data.index} of ${data.total}`;
      $('qtext').innerText = data.question.question;
      $('feedback').innerText = '';
      
      let grid = $('opts'); grid.innerHTML = '';
      for (const [k, v] of Object.entries(data.question.options)) {
        let b = document.createElement('button');
        b.className = 'opt-btn'; b.innerText = v; // Cleaner: Just the answer text
        b.onclick = () => {
          if(state.answered) return;
          state.answered = true;
          clearInterval(state.tid);
          socket.emit('submit_answer', { roll_no: state.roll, choice: k });
          
          // Lock UI state immediately
          document.querySelectorAll('.opt-btn').forEach(btn => {
              btn.style.opacity = '0.5'; 
              btn.style.pointerEvents = 'none';
          });
          b.style.opacity = '1';
          b.style.background = 'rgba(255,255,255,0.2)';
          b.style.borderColor = '#ffffff';
          
          $('feedback').innerText = 'Data transmitted. Awaiting validation...';
        };
        grid.appendChild(b);
      }
      show('quiz');
      
      let t = data.question.timeLimit;
      $('timer').innerText = t + 's';
      $('timer').className = 'timer';
      if(state.tid) clearInterval(state.tid);
      state.tid = setInterval(() => {
        t -= 1; $('timer').innerText = t + 's';
        if (t <= 5) $('timer').classList.add('urgent');
        if(t <= 0) { clearInterval(state.tid); if(!state.answered) $('feedback').innerText = "Time limit exceeded."; }
      }, 1000);
    });

    socket.on('answer_feedback', d => {
      $('score').innerText = d.score;
      $('feedback').style.color = d.correct ? 'var(--success)' : 'var(--danger)';
      $('feedback').innerText = d.correct ? `VALIDATED: +${d.points} pts` : 'INCORRECT.';
      $('waitMsg').innerText = "Preparing Next Module...";
      $('waitMsg').classList.remove('pulse-text');
      setTimeout(() => {
          $('feedback').style.color = 'var(--muted)';
          $('waitMsg').classList.add('pulse-text');
          show('wait');
      }, 2500);
    });

    socket.on('show_results', board => {
      let me = board.find(x => x.roll_no === state.roll);
      if(me) $('score').innerText = me.score;
    });

    socket.on('game_over', () => { 
        $('waitMsg').innerText = "Session Terminated."; 
        $('waitMsg').classList.remove('pulse-text');
        show('wait'); 
    });
  </script>
</body>
</html>
