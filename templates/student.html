<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Quiz Environment</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root {
      --bg: #000000;
      --card-bg: rgba(18, 18, 22, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --accent: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
      --muted: #71717a;
    }
    * { box-sizing: border-box; touch-action: manipulation; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }

    .card { background: var(--card-bg); padding: 40px; border-radius: 32px; border: 1px solid var(--border); width: 100%; max-width: 500px; backdrop-filter: blur(30px); box-shadow: 0 40px 80px rgba(0,0,0,0.8); text-align: center; position: relative; overflow: hidden; }

    h1 { font-size: 24px; font-weight: 800; margin-bottom: 24px; letter-spacing: -0.5px; }
    input { width: 100%; padding: 18px; margin-bottom: 16px; border-radius: 16px; border: 1px solid var(--border); background: rgba(255,255,255,0.03); color: white; font-size: 16px; outline: none; transition: 0.2s; }
    input:focus { border-color: var(--accent); background: rgba(59, 130, 246, 0.05); }

    button { width: 100%; padding: 18px; border-radius: 16px; border: none; background: #fff; color: #000; font-weight: 700; cursor: pointer; transition: 0.2s; }
    button:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(255,255,255,0.12); }
    button:active { transform: scale(0.98); }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 32px; }
    .opt { background: rgba(255,255,255,0.04); border: 1px solid var(--border); padding: 24px; border-radius: 20px; color: #fff; cursor: pointer; font-size: 16px; font-weight: 600; transition: 0.2s; }
    .opt:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
    .opt:active { transform: scale(0.98); }
    .opt.selected { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 24px rgba(59,130,246,0.35); }
    .opt.disabled { opacity: 0.5; cursor: not-allowed; }

    .status-text { font-size: 14px; color: var(--muted); margin-top: 24px; font-weight: 500; }
    .timer { font-size: 48px; font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; margin: 10px 0; transition: color 0.3s; }
    .timer.pulse { color: var(--danger); animation: heartbeat 1s infinite; }
    @keyframes heartbeat { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

    .leaderboard-row { display: flex; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--border); }
    .hidden { display: none !important; }

    .feedback-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 32px; z-index: 10; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .feedback-overlay.visible { opacity: 1; pointer-events: auto; }
    .feedback-overlay h2 { font-size: 32px; margin: 0; text-transform: uppercase; letter-spacing: 2px; }
    .feedback-overlay p { font-size: 18px; margin-top: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div id="lobby" class="card">
    <h1>Login Module</h1>
    <input type="text" id="rno" placeholder="Roll No (e.g. 22CSEC01)">
    <input type="text" id="fname" placeholder="Full Name">
    <button onclick="join()">Initialize Session</button>
  </div>

  <div id="wait" class="card hidden">
    <h2 id="waitMsg" style="font-weight:400; color:var(--muted)">Awaiting server synchronization...</h2>
  </div>

  <div id="quiz" class="card hidden" style="max-width: 600px;">
    <div id="qnum" style="color:var(--accent); font-weight:bold; font-size:12px; text-transform:uppercase; letter-spacing:2px;">MODULE 1</div>
    <div id="timer" class="timer">20</div>
    <h2 id="qtext" style="font-size:20px; margin: 20px 0;">...</h2>
    <div id="opts" class="grid"></div>
    <div class="status-text" id="feedback">Waiting for your selection</div>

    <div id="feedbackOverlay" class="feedback-overlay hidden">
      <h2 id="resultTitle">...</h2>
      <p id="resultPoints"></p>
    </div>
  </div>

  <script>
    const socket = io({ transports: ['websocket'], upgrade: false });
    let state = { roll: '', answered: false, tid: null };
    const $ = id => document.getElementById(id);
    const show = id => { ['lobby','wait','quiz'].forEach(x => $(x).classList.add('hidden')); $(id).classList.remove('hidden'); };

    function join() {
      state.roll = $('rno').value.trim();
      let n = $('fname').value.trim();
      if(!state.roll || !n) return alert('Fill credentials');
      socket.emit('join_game', { roll_no: state.roll, name: n });
      show('wait');
    }

    socket.on('receive_question', (data) => {
      state.answered = false;
      $('qnum').innerText = `Module ${data.index} / ${data.total}`;
      $('qtext').innerText = data.question.question;
      $('feedback').innerText = 'Make your selection';

      let grid = $('opts'); grid.innerHTML = '';
      for (const [k, v] of Object.entries(data.question.options)) {
        let b = document.createElement('button');
        b.className = 'opt'; b.innerText = v;
        b.onclick = () => {
          if(state.answered) return;
          state.answered = true;
          socket.emit('submit_answer', { roll_no: state.roll, choice: k });
          b.classList.add('selected');
          Array.from(grid.children).forEach(btn => { if(btn !== b) btn.classList.add('disabled'); });
          $('feedback').innerText = 'Transmission sent...';
        };
        grid.appendChild(b);
      }
      show('quiz');

      let t = data.question.timeLimit;
      $('timer').innerText = t; $('timer').className = 'timer';
      if(state.tid) clearInterval(state.tid);
      state.tid = setInterval(() => {
        t--; $('timer').innerText = t;
        if(t <= 5) $('timer').className = 'timer pulse';
        if(t <= 0) clearInterval(state.tid);
      }, 1000);
    });

    socket.on('answer_feedback', (d) => {
      const overlay = $('feedbackOverlay');
      overlay.classList.remove('hidden');
      requestAnimationFrame(() => overlay.classList.add('visible'));

      $('resultTitle').innerText = d.correct ? "CORRECT!" : "INCORRECT";
      $('resultTitle').style.color = d.correct ? 'var(--success)' : 'var(--danger)';
      $('resultPoints').innerText = `+${d.points} Points | Total: ${d.score}`;

      setTimeout(() => {
        overlay.classList.remove('visible');
        setTimeout(() => overlay.classList.add('hidden'), 300);
      }, 2500);
    });

    socket.on('game_over', (data) => {
        let h = '<h2 style="color:var(--success)">Session Concluded</h2><br/>';
        data.leaderboard.forEach((x, i) => {
            h += `<div class="leaderboard-row"><span>${i+1}. ${x.name}</span><strong>${x.score} pts</strong></div>`;
        });
        $('waitMsg').innerHTML = h;
        show('wait');
    });
  </script>
</body>
</html>
