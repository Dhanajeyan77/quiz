<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root {
      --bg: #000000;
      --panel: rgba(15, 15, 20, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --muted: #a1a1aa;
      --accent: #ffffff;
      --blue: #3b82f6;
      --green: #10b981;
      --red: #ef4444;
      --purple: #8b5cf6;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      padding: 40px 20px; 
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    /* Ambient Background Glow */
    body::before {
      content: '';
      position: fixed;
      top: -20%; left: -10%;
      width: 50vw; height: 50vw;
      background: radial-gradient(circle, rgba(139,92,246,0.1) 0%, transparent 70%);
      z-index: -1;
    }
    
    .container { 
      max-width: 1200px; 
      margin: 0 auto; 
      display: grid; 
      grid-template-columns: 380px 1fr; 
      gap: 32px; 
    }
    
    @media (max-width: 900px) { 
      .container { grid-template-columns: 1fr; } 
    }
    
    .panel { 
      background: var(--panel); 
      padding: 32px; 
      border-radius: 24px; 
      border: 1px solid var(--border); 
      backdrop-filter: blur(24px); 
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 24px; letter-spacing: -0.5px; }
    
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    
    h2 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; margin: 0; }
    
    .tracker-badge {
      background: rgba(59,130,246,0.15);
      color: var(--blue);
      border: 1px solid rgba(59,130,246,0.3);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      transition: all 0.3s ease;
    }
    
    .stat-box { 
      background: rgba(255,255,255,0.02); 
      border: 1px solid var(--border); 
      padding: 32px 24px; 
      border-radius: 20px; 
      text-align: center; 
      margin-bottom: 32px; 
    }
    
    .stat-num { font-size: 56px; font-weight: 800; color: var(--green); line-height: 1; letter-spacing: -2px; }
    .stat-label { color: var(--muted); font-size: 12px; margin-top: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    
    button { 
      width: 100%; 
      padding: 18px; 
      border: none; 
      border-radius: 14px; 
      color: #000; 
      background: var(--accent); 
      cursor: pointer; 
      font-weight: 700; 
      font-size: 15px; 
      margin-bottom: 12px; 
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
    }
    
    button:active { transform: scale(0.97); }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    
    .btn-secondary { background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--border); }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); }
    .btn-danger { background: rgba(239,68,68,0.1); color: var(--red); border: 1px solid rgba(239,68,68,0.2); }
    .btn-danger:hover { background: var(--red); color: white; }
    .btn-purple { background: var(--purple); color: white; }
    
    .file-upload-wrapper {
      position: relative;
      margin-bottom: 12px;
    }
    
    input[type="file"] { 
      width: 100%; 
      padding: 16px; 
      background: rgba(255,255,255,0.02); 
      border-radius: 14px; 
      color: var(--muted); 
      border: 1px dashed var(--border); 
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    input[type="file"]:hover { border-color: var(--blue); }
    
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th { text-align: left; padding: 16px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; border-bottom: 1px solid var(--border); }
    td { padding: 18px 16px; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 15px; font-weight: 500; transition: background 0.2s; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    
    .rank-cell { color: var(--muted); font-weight: 600; }
    .score-cell { color: var(--green); font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
    
    .top-three { background: linear-gradient(90deg, rgba(255,255,255,0.04) 0%, transparent 100%); }
    
    /* Toast Notification */
    #toast {
      position: fixed; top: 24px; right: 24px; background: var(--panel); border: 1px solid var(--border); padding: 16px 24px; border-radius: 12px; color: white; font-weight: 500; font-size: 14px; backdrop-filter: blur(12px); transform: translateX(150%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    #toast.show { transform: translateX(0); }
  </style>
</head>
<body>
  <div id="toast">Notification</div>

  <div class="container">
    
    <div class="panel">
      <h1>Command Center</h1>
      
      <div class="stat-box">
        <div class="stat-num" id="count">0</div>
        <div class="stat-label">Active Connections</div>
      </div>
      
      <div class="section-header">
        <h2>1. Ingestion</h2>
      </div>
      <div class="file-upload-wrapper">
        <input type="file" id="csvfile" accept=".csv">
      </div>
      <button class="btn-secondary" onclick="upload()">Load Data Matrix</button>
      <p id="msg" style="color:var(--muted); font-size: 13px; margin: 8px 0 32px 0; text-align: center; font-weight: 500;"></p>
      
      <div class="section-header">
        <h2>2. Execution</h2>
        <span id="qTracker" class="tracker-badge">0 / 0</span>
      </div>
      <button onclick="socket.emit('admin_next_question')">Deploy Next Module</button>
      <button class="btn-secondary" onclick="socket.emit('admin_show_leaderboard')">Sync Standings</button>
      
      <div style="margin-top: 40px; padding-top: 32px; border-top: 1px solid var(--border);">
        <button class="btn-danger" onclick="endGame()">Terminate & Save Data</button>
        <button class="btn-purple" onclick="window.location.href='/download-report'">Extract CSV Report</button>
      </div>
    </div>

    <div class="panel">
      <h1>Global Rankings</h1>
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Identifier</th>
            <th>Operator</th>
            <th style="text-align: right;">Yield</th>
          </tr>
        </thead>
        <tbody id="board">
          <tr><td colspan="4" style="text-align: center; color: var(--muted); padding: 60px 20px; font-size: 14px;">Awaiting incoming telemetry...</td></tr>
        </tbody>
      </table>
    </div>
    
  </div>

  <script>
    const socket = io({ transports: ['websocket'], upgrade: false });
    
    function showToast(msg, isSuccess = true) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.borderColor = isSuccess ? 'rgba(16,185,129,0.3)' : 'rgba(239,68,68,0.3)';
      toast.style.color = isSuccess ? '#10b981' : '#ef4444';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
    
    async function upload() {
      let f = document.getElementById('csvfile').files[0];
      if(!f) return showToast("Select a CSV matrix first.", false);
      
      document.getElementById('msg').innerText = "Processing...";
      let form = new FormData(); form.append('file', f);
      
      try {
        let r = await fetch('/upload-csv', { method: 'POST', body: form });
        let res = await r.json();
        
        if(res.success) {
            document.getElementById('msg').innerText = `Ready: ${res.count} modules loaded.`;
            document.getElementById('qTracker').innerText = `0 / ${res.count}`;
            document.getElementById('qTracker').style.color = 'var(--blue)';
            document.getElementById('qTracker').style.background = 'rgba(59,130,246,0.15)';
            document.getElementById('qTracker').style.borderColor = 'rgba(59,130,246,0.3)';
            showToast("Matrix loaded successfully.");
        } else {
            document.getElementById('msg').innerText = `ERR: ${res.error}`;
            showToast("Failed to load matrix.", false);
        }
      } catch (err) {
        document.getElementById('msg').innerText = `Network Error`;
        showToast("Connection failed.", false);
      }
    }

    function endGame() {
      if(confirm('WARNING: Lock all scores and write to permanent PostgreSQL storage?')) {
          socket.emit('admin_end_game');
          showToast("Session terminated. Saving to DB...");
      }
    }

    socket.on('update_lobby', d => {
        document.getElementById('count').innerText = d.count;
    });
    
    // TRACKER LOGIC ADDED HERE
    socket.on('receive_question', (data) => {
      const tracker = document.getElementById('qTracker');
      tracker.innerText = `${data.index} / ${data.total}`;
      
      // Visual cue when hitting the final question
      if(data.index === data.total) {
          tracker.style.color = 'var(--green)';
          tracker.style.background = 'rgba(16,185,129,0.15)';
          tracker.style.borderColor = 'rgba(16,185,129,0.3)';
      } else {
          tracker.style.color = 'var(--blue)';
          tracker.style.background = 'rgba(59,130,246,0.15)';
          tracker.style.borderColor = 'rgba(59,130,246,0.3)';
      }
    });
    
    socket.on('show_results', data => {
      if (data.length === 0) return;
      let h = '';
      data.forEach((x, i) => { 
          let rowClass = i < 3 ? 'class="top-three"' : '';
          let medal = i === 0 ? '🥇 ' : i === 1 ? '🥈 ' : i === 2 ? '🥉 ' : '';
          h += `<tr ${rowClass}>
                  <td class="rank-cell">${medal}#${x.rank}</td>
                  <td style="color: rgba(255,255,255,0.7);">${x.roll_no}</td>
                  <td style="font-weight: 600;">${x.name}</td>
                  <td class="score-cell">${x.score}</td>
                </tr>`; 
      });
      document.getElementById('board').innerHTML = h;
    });
  </script>
</body>
</html>
